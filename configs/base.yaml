# 论文 Base 模型的主要维度；不是完整的 WMT 复现实验配方。
# 真实数据、词表和训练预算在相应模块完成后确定。
model:
  d_model: 512
  n_heads: 8
  num_encoder_layers: 6
  num_decoder_layers: 6
  d_ff: 2048
  dropout: 0.1
  max_seq_len: 512

tokenizer:
  type: word
  pad_id: 0
  unk_id: 1
  bos_id: 2
  eos_id: 3

data:
  task: translation
  train_path: null
  validation_path: null
  test_path: null

training:
  device: auto
  seed: 42
  warmup_steps: 4000
  label_smoothing: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.98
  adam_eps: 1.0e-9
  checkpoint_dir: outputs/checkpoints/base
